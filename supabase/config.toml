#:schema https://supabase.com/schemas/config/v1.json

project_id = "vehicle_smart_card"

# RoadPing uses direct email/password registration and must create a session
# immediately, without a separate confirmation step.
[auth.email]
enable_confirmations = false

# RoadPing deliberately has no SMS-OTP or authenticator-code flow.
[auth.sms]
enabled = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
